<div *ngFor = "let item of detailLabel; index as ind">
<div class="infoLine">
  <h3>{{item}}:</h3><h5>----</h5><h5>{{detailValue[ind]}}</h5>
</div>
</div>
<br>
<div class="infoLine_buttons">
  <button *ngIf="buttonState()=='Edit'" (click)="buttonClicked('Edited')">Edit</button>
  <button *ngIf="buttonState()!='Edit'" (click)="buttonClicked('Edit')">Cancel</button>
  <button *ngIf="buttonState()!='Edit'" (click)="buttonClicked('Edit')">Save</button>
</div>
