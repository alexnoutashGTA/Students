
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages</title>
  <link rel="stylesheet" href="messages.css" />
</head>
<body>
  <div class="container">
    <h1>Inbox</h1>

    <div class="message">
      <h2 class="sender">John Smith</h2>
      <p class="content">Hey there! Just checking in to see how your project is going.</p>
      <span class="timestamp">July 13, 2025</span>
    </div>

    <div class="message">
      <h2 class="sender">Alex Noutash</h2>
      <p class="content">Please remember to push your updates by the deadline.</p>
      <span class="timestamp">July 12, 2025</span>
    </div>
  </div>
</body>
</html>
